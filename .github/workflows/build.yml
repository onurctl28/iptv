name: APK Derle

# Her kod gönderiminde ve elle tetiklendiğinde APK üretir.
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub sunucularında Android SDK zaten kuruludur (ANDROID_HOME ayarlı).
      # Ayrı bir kurulum eklentisi kullanmıyoruz; sadece lisansları onaylayıp derliyoruz.
      - name: APK derle (debug)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Hata logunu repoya yaz (yalnızca başarısızlıkta)
        if: failure()
        run: |
          mkdir -p _ci
          grep -E "e: |error:|> Task|FAILURE|Caused by|Compilation" /tmp/build.log | tail -n 120 > _ci/last_build_error.txt || true
          tail -n 60 /tmp/build.log >> _ci/last_build_error.txt || true
          git config user.email "ci@local"
          git config user.name "ci"
          git add _ci/last_build_error.txt
          git commit -m "ci: derleme hatasi logu [skip ci]" || true
          git push origin HEAD:main || true

      - name: APK'yı yeniden adlandır
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IPTV-Oynatici.apk

      - name: APK'yı yükle (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Oynatici-APK
          path: dist/IPTV-Oynatici.apk
          if-no-files-found: error

      - name: Sürüm olarak yayınla (kolay indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "En son APK"
          files: dist/IPTV-Oynatici.apk
          prerelease: true
          body: "Otomatik derlenen en son APK. Aşağıdaki IPTV-Oynatici.apk dosyasını indirip TV box / Android TV cihazınıza kurun."
